<style>

[data-theme=dark] input:focus,[data-theme=dark] select:focus{outline:none;border-color:#a3a3a3}
input[type=color]{-webkit-appearance:none;appearance:none;height:24px;padding:2px;border:1px solid var(--swb);border-radius:4px;background:var(--btn);cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}input[type=color]::-webkit-color-swatch{border:0;border-radius:2px}input[type=color]::-moz-color-swatch{border:0;border-radius:2px}
.kv div:has(:checked) input[type=color]{opacity:.35}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:12px/1.5 system-ui,sans-serif;color:var(--fg)}
body{display:grid;grid-template:auto 1fr auto/40px 1fr 236px}
button{font:inherit;padding:2px 5px;border:1px solid var(--btnb);border-radius:3px;background:var(--btn);color:var(--bfg);cursor:pointer}

input,select{font:inherit}

#mBar>i{width:1px;height:18px;background:var(--line);margin:0 4px}
#mTools{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;background:var(--bar);border-right:1px solid var(--line)}
#mTools button{width:30px;height:30px;padding:0;display:grid;place-items:center}
#mTools svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
#mTools a{margin-top:auto;width:30px;height:30px;display:grid;place-items:center;color:inherit;opacity:.6}#mTools a:hover{opacity:1}
#mTools>i{width:22px;height:1px;background:var(--line);margin:3px 0}
#mView{position:relative;overflow:hidden;background:var(--view)}
#mStage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#mStage>*{position:absolute!important;left:0;top:0;width:var(--w)!important;height:var(--h)!important;overflow:visible!important}
#mPage{background:#fff;outline:1px solid var(--pageb);box-shadow:3px 3px 8px #0003}
#mGrid{pointer-events:none}#mGrid path{fill:none;stroke-width:1;vector-effect:non-scaling-stroke;shape-rendering:crispEdges}#mGrid .mi{stroke:#5a78aa30}#mGrid .ma{stroke:#5a78aa70}
.noR #mRx,.noR #mRy{display:none}
#mGW{will-change:transform;transform-origin:0 0}
#mGhost{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
#mCap{position:absolute;inset:0}
#mHud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#mRx,#mRy{position:absolute;left:0;top:0;width:100%;height:18px;pointer-events:none}#mRy{width:18px;height:100%}
#mHud [data-h]{pointer-events:all;cursor:pointer}
#mSide{overflow:auto;padding:4px 8px;background:var(--side);border-left:1px solid var(--line)}
#mSide h4{margin:8px 0 4px;padding-bottom:2px;color:var(--h4);border-bottom:1px solid var(--h4b)}#mSide h4:first-child{margin-top:4px}#mSide h4 small{font-weight:normal}
#mSide label{display:inline-flex;align-items:center;gap:4px;margin:2px 0}
#mSide .g2{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px}#mSide .g2 label{min-width:0}#mSide .g2 input[type=number]{flex:1;min-width:40px;width:auto}

#mSide .row{display:flex;gap:3px;margin:2px 0}#mSide .row button{flex:1;min-width:0;padding:2px}
.ic button{height:24px;padding:0;display:grid;place-items:center}.ic svg{width:16px;height:16px;fill:currentColor;stroke:currentColor}.ic rect{stroke:none}
#mSide select{width:100%}#mPg{flex:1;width:auto!important;min-width:0}#mSide .row .ori{flex:0 0 28px}
#mSide input[type=number]{width:62px;-moz-appearance:textfield}#mSide input::-webkit-inner-spin-button{display:none}

.ed{position:absolute;white-space:pre;width:max-content;max-width:none;overflow:visible;overflow-wrap:normal;outline:1px solid #1a73e8;background:#fffd;min-width:4px;line-height:1.2;padding:0 1px}
body.chat{grid-template-columns:40px 1fr 236px 300px}
#mChat{display:none;grid-area:2/4;flex-direction:column;gap:4px;overflow:hidden;padding:4px 8px;background:var(--side);border-left:1px solid var(--line)}.chat #mChat{display:flex}
