<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>minisvgbench</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font:12px/1.5 system-ui,sans-serif;color:#222}
body{display:grid;grid-template:auto 1fr auto/1fr 236px}
button{font:inherit;padding:2px 5px;border:1px solid #bbb;border-radius:3px;background:#fff;cursor:pointer}
button:hover{background:#eef3ff}button.on{background:#d6e4ff;border-color:#6d94e0}
input,select{font:inherit}
#mBar{grid-column:1/3;display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:4px;background:#f3f3f3;border-bottom:1px solid #ccc}
#mBar>i{width:1px;height:18px;background:#ccc;margin:0 4px}
#mView{position:relative;overflow:hidden;background:#cfcfcf}
#mStage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#mStage>*{position:absolute!important;left:0;top:0;width:var(--w)!important;height:var(--h)!important;overflow:visible!important}
#mPage{background:#fff;outline:1px solid #777;box-shadow:3px 3px 8px #0003}
#mGW{will-change:transform;transform-origin:0 0}
#mGhost{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
#mCap{position:absolute;inset:0}
#mHud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#mHud [data-h]{pointer-events:all;cursor:pointer}
#mHud [data-h=nw],#mHud [data-h=se]{cursor:nwse-resize}#mHud [data-h=ne],#mHud [data-h=sw]{cursor:nesw-resize}#mHud [data-h=n],#mHud [data-h=s]{cursor:ns-resize}#mHud [data-h=e],#mHud [data-h=w]{cursor:ew-resize}
#mSide{overflow:auto;padding:4px 8px;background:#f7f7f7;border-left:1px solid #ccc}
#mSide h4{margin:10px 0 4px;color:#555;border-bottom:1px solid #ddd}
#mSide label{display:inline-flex;align-items:center;gap:3px;margin:2px 6px 2px 0}
#mSide input[type=number]{width:58px}
#mSt{grid-column:1/3;height:22px;display:flex;gap:18px;padding:2px 8px;background:#f3f3f3;border-top:1px solid #ccc;white-space:nowrap;overflow:hidden}
.ed{position:absolute;white-space:pre;outline:1px solid #1a73e8;background:#fffd;min-width:4px;line-height:1.2;padding:0 1px}
</style>
</head>
<body>
<div id="mBar">
<button data-a="new" title="New canvas">New</button><button data-a="open" title="Ctrl+O">Open</button><button data-a="imp" title="Ctrl+I">Import</button><button data-a="svg" title="Export SVG (Ctrl+S)">SVG</button><button data-a="p300" title="Export PNG at 300 dpi">PNG 300</button><button data-a="p600" title="Export PNG at 600 dpi">PNG 600</button><i></i>
<button data-a="undo" title="Ctrl+Z">Undo</button><button data-a="redo" title="Ctrl+Shift+Z">Redo</button><i></i>
<button data-t="sel" class="on" title="V">Select</button><button data-t="text" title="T">Text</button><button data-t="rect" title="R">Rect</button><button data-t="line" title="L">Line</button><button data-t="arrow" title="A">Arrow</button>
<button data-a="label" title="Place a label at the top-left of each selected panel">Label</button><input id="mLbl" value="A" maxlength="1" title="Next label letter" style="width:2.2em;text-align:center"><i></i>
<button data-a="group" title="Ctrl+G">Group</button><button data-a="ungroup" title="Ctrl+Shift+G">Ungroup</button><i></i>
<button data-a="top" title="Raise to top (Home)">Top</button><button data-a="up" title="Raise one step (PageUp)">Up</button><button data-a="dn" title="Lower one step (PageDown)">Down</button><button data-a="bot" title="Lower to bottom (End)">Bottom</button><i></i>
<button data-a="copy" title="Ctrl+C">Copy</button><button data-a="paste" title="Ctrl+V">Paste</button><button data-a="del" title="Delete (Del)">Del</button><i></i>
<button data-a="fit" title="Fit page to window (5)">Fit</button>
</div>
<div id="mView"><div id="mStage"><div id="mPage"></div><div id="mGW"><svg id="mGhost" xmlns="http://www.w3.org/2000/svg"></svg></div></div><div id="mCap"></div><svg id="mHud" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="mSide">
<h4>Position &amp; size (mm)</h4>
<label>X<input type="number" step="0.1" data-f="x"></label><label>Y<input type="number" step="0.1" data-f="y"></label>
<label>W<input type="number" step="0.1" data-f="w"></label><label>H<input type="number" step="0.1" data-f="h"></label>
<label><input type="checkbox" id="mLock" checked>Lock ratio</label><label>Rotate<input type="number" data-f="r" value="0">°</label>
<h4>Align &amp; distribute</h4>
<select id="mRel"><option value="">Relative to selection</option><option value="1">Relative to page</option></select><br>
<button data-a="al">Left</button><button data-a="ac">Center</button><button data-a="ar">Right</button><br>
<button data-a="at">Top</button><button data-a="am">Middle</button><button data-a="ab">Bottom</button><br>
<button data-a="dh">Distribute H</button><button data-a="dv">Distribute V</button>
<h4>Text</h4>
<label>Size<input type="number" step="0.5" min="0.5" data-f="fs">pt</label>
<label>Font<input list="mFonts" data-f="ff" size="13"></label>
<label>Color<input type="color" data-f="tc"></label><br>
<button data-a="bold"><b>B</b></button><button data-a="ital"><i>I</i></button><button data-a="sup" title="Applies to selected characters while editing">X²</button><button data-a="sub" title="Applies to selected characters while editing">X₂</button>
<datalist id="mFonts"><option>Arial<option>Helvetica<option>Liberation Sans<option>Times New Roman<option>Courier New<option>Symbol</datalist>
<h4>All text</h4>
<button data-a="allText">Select all text</button><button data-a="arial">All to Arial</button>
<div id="mSizes"></div>
<h4>Style</h4>
<label>Fill<input type="color" data-f="fill"></label><label><input type="checkbox" data-f="nofill">None</label><br>
<label>Stroke<input type="color" data-f="stroke"></label><label><input type="checkbox" data-f="nostroke">None</label><br>
<label>Width<input type="number" step="0.1" min="0" data-f="sw">pt</label><label>Opacity<input type="number" min="0" max="100" step="5" data-f="op">%</label>
</div>
<div id="mSt"><span id="mMsg"></span><span id="mCtx"></span><span id="mSel"></span><span id="mPos"></span><span id="mZoom"></span></div>
<input type="file" id="mFile" accept=".svg,image/svg+xml" hidden>
<dialog id="mNew"><form method="dialog">
<p><select id="mPre"><option value="210,297">A4 (210×297 mm)</option><option value="85,85">Single column 85 mm</option><option value="180,120" selected>Double column 180 mm</option><option value="">Custom</option></select></p>
<p><label>Width <input id="mNW" type="number" value="180" min="1" step="0.1"></label> <label>Height <input id="mNH" type="number" value="120" min="1" step="0.1"></label> mm</p>
<p><button value="ok">Create</button> <button value="">Cancel</button></p>
</form></dialog>
<script>
